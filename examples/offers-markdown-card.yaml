type: markdown
title: berse · Best offers
content: |-
  {% set entity = 'sensor.berse_best_offers' %}
  {% set offers = state_attr(entity, 'offers') or [] %}
  **{{ states(entity) }} offers · Excluding VAT**

  {% set kwh = state_attr(entity, 'reference_kwh') %}
  {% if kwh is not none %}
  {{ state_attr(entity, 'reference_label') }}: {{ '%.2f' | format(kwh | float) }} kWh over {{ state_attr(entity, 'reference_days') }} days
  {% else %}
  {{ state_attr(entity, 'summary') or 'Waiting for consumption data.' }}
  {% endif %}

  {% for offer in offers[:5] %}
  **{{ loop.index }}. {{ offer.supplier_name | e }} — {{ offer.offer_name | e }}**

  Estimated cost: {{ '%.2f' | format(offer.candidate_cost | float) }} EUR · Saving: {{ '%.2f' | format(offer.savings | float) }} EUR

  Energy: {{ '%.4f' | format(offer.energy_price | float) }} EUR/kWh · Standing: {{ '%.4f' | format(offer.standing_charge | float) }} EUR/day

  {% endfor %}
  Last update: {{ state_attr(entity, 'last_successful_update') or 'Not yet updated' }}
