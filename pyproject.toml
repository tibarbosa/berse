[project]
name = "barbs-erse"
version = "0.1.2"
description = "Home Assistant integration for single-rate ERSE electricity offers"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["custom_components/barbs_erse/translations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
