name: Validate release package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements_test.txt ruff
      - run: ruff check .
      - run: python -m pytest
      - run: node --check custom_components/barbs_erse/frontend/barbs-erse-offers.js
      - uses: hacs/action@main
        with:
          category: integration
      - uses: home-assistant/actions/hassfest@master
